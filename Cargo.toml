[workspace]
members = [
    "crates/chess",      # Pure chess rules, board state, engine integration
    "crates/lichess",   # Lichess REST APIs and WebSocket handling
    "crates/platform",  # Windowing (Wayland/X11), event loop, raw input
    "crates/renderer",  # wgpu abstraction, shaders, GPU pipelines
    "crates/ui",        # Our lightweight, immediate-mode or custom retained UI
    "crates/client"     # The main binary tying the services and state together
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# We will add our shared dependencies here as we need them (e.g., wgpu, wayland-client, tokio)
