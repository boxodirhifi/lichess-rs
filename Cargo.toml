[workspace]
members = [
    "crates/chess",
    "crates/lichess",
    "crates/platform",
    "crates/renderer",
    "crates/ui",
    "crates/client"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
winit = "0.30"
wgpu = "23"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
raw-window-handle = "0.6"
glam = "0.29"
bytemuck = { version = "1.19", features = [ "derive" ] }
